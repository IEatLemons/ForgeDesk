name: Release ForgeDesk

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: forgedesk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Universal
            os: macos-latest
            platform: mac
          - name: Windows x64
            os: windows-latest
            platform: win
          - name: Linux x64
            os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: corepack enable

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${VERSION}."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package for current runner
        env:
          FORGEDESK_CODESIGN_IDENTITY: '-'
        run: pnpm package:desktop

      - name: Validate updater assets
        run: node scripts/validate-release-assets.mjs --platform ${{ matrix.platform }} --dir dist

      - name: Stage release assets
        run: node scripts/stage-release-assets.mjs --platform ${{ matrix.platform }} --source dist --target release-assets/${{ matrix.platform }}

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/${{ matrix.platform }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download validated build assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify complete release set
        run: node scripts/validate-release-assets.mjs --platform all --dir release-assets

      - name: Resolve release channel
        id: channel
        shell: bash
        run: |
          set -euo pipefail
          echo "name=$(node scripts/release-channel.mjs "${GITHUB_REF_NAME}")" >> "$GITHUB_OUTPUT"

      - name: Create draft, upload assets, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ steps.channel.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          mapfile -t EXPECTED_ASSETS < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)

          if gh release view "${TAG}" >/dev/null 2>&1; then
            if [ "$(gh release view "${TAG}" --json isDraft --jq '.isDraft')" != "true" ]; then
              echo "${TAG} already has a public release; refusing to overwrite it."
              exit 1
            fi
            echo "Reusing draft release ${TAG}."
          else
            if [ "${RELEASE_CHANNEL}" = "prerelease" ]; then
              gh release create "${TAG}" --draft --prerelease --title "ForgeDesk v${VERSION}" --generate-notes
            else
              gh release create "${TAG}" --draft --title "ForgeDesk v${VERSION}" --generate-notes
            fi
          fi

          gh release upload "${TAG}" release-assets/* --clobber
          mapfile -t UPLOADED_ASSETS < <(gh release view "${TAG}" --json assets --jq '.assets[].name' | sort)
          for asset in "${EXPECTED_ASSETS[@]}"; do
            if ! printf '%s\n' "${UPLOADED_ASSETS[@]}" | grep -Fqx "${asset}"; then
              echo "Draft ${TAG} is missing uploaded asset: ${asset}"
              exit 1
            fi
          done

          if [ "${RELEASE_CHANNEL}" = "prerelease" ]; then
            gh release edit "${TAG}" --draft=false --prerelease
          else
            gh release edit "${TAG}" --draft=false --latest
          fi
