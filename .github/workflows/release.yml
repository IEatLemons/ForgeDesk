name: Release ForgeDesk

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forgedesk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish macOS arm64
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: corepack enable

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${VERSION}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${EXPECTED_TAG}."
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS package
        env:
          FORGEDESK_CODESIGN_IDENTITY: '-'
        run: pnpm package:mac

      - name: Validate updater artifacts
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            "dist/ForgeDesk-${VERSION}-arm64.dmg"
            "dist/ForgeDesk-${VERSION}-arm64.dmg.blockmap"
            "dist/ForgeDesk-${VERSION}-arm64.zip"
            "dist/ForgeDesk-${VERSION}-arm64.zip.blockmap"
            "dist/latest-mac.yml"
          )
          for asset in "${assets[@]}"; do
            if [ ! -s "${asset}" ]; then
              echo "Missing updater artifact: ${asset}"
              exit 1
            fi
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          assets=(
            "dist/ForgeDesk-${VERSION}-arm64.dmg"
            "dist/ForgeDesk-${VERSION}-arm64.dmg.blockmap"
            "dist/ForgeDesk-${VERSION}-arm64.zip"
            "dist/ForgeDesk-${VERSION}-arm64.zip.blockmap"
            "dist/latest-mac.yml"
          )
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${assets[@]}" --clobber
          else
            gh release create "${TAG}" "${assets[@]}" \
              --title "ForgeDesk v${VERSION}" \
              --generate-notes \
              --latest
          fi
